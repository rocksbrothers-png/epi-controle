      <section id="relatorios-view" class="view">
        <div class="reports-grid">
          <form id="report-filter-form" class="card form-stack">
            <h3 data-i18n="report.filters">Filtros</h3>
            <label><span data-i18n="company.title">Empresa</span><select name="company_id" id="report-company"></select></label>
            <label><span data-i18n="unit.title">Unidade</span><select name="unit_id" id="report-unit"></select></label>
            <small id="report-unit-hint" class="hint" style="display:none;">Seu perfil está vinculado a uma unidade operacional fixa.</small>
            <label>Colaborador<select name="employee_id" id="report-employee"></select></label>
            <label>SETOR<select name="sector" id="report-sector"></select></label>
            <label>Tipo de Vínculo
              <select name="tipo_vinculo" id="report-tipo-vinculo">
                <option value="">Todos</option>
                <option value="CLT">CLT</option>
                <option value="Terceirizado">Terceirizado</option>
                <option value="Temporário">Temporário</option>
                <option value="Prestador de Serviço">Prestador de Serviço</option>
              </select>
            </label>
            <label>EPI<select name="epi_id" id="report-epi"></select></label>
            <label>Status do arquivo
              <select name="status" id="report-ficha-status">
                <option value="">Todos</option>
                <option value="archived">Arquivada</option>
                <option value="expired">Expirada</option>
                <option value="purged">Purgada</option>
              </select>
            </label>
            <label>Data inicial<input name="start_date" type="date"></label>
            <label>Data final<input name="end_date" type="date"></label>
            <div class="action-group">
              <button class="primary" type="submit">Aplicar</button>
              <button class="ghost" type="button" id="report-export-pdf">Exportar PDF</button>
            </div>
          </form>
          <article class="card"><h3 data-i18n="report.summary">Resumo</h3><div id="report-summary"></div></article>
          <article class="card"><h3 data-i18n="report.byUnit">Por unidade</h3><div id="report-units"></div></article>
          <article class="card"><h3 data-i18n="report.bySector">Por SETOR</h3><div id="report-sectors"></div></article>
          <article class="card"><h3 data-i18n="report.byType">Por Tipo de Vínculo</h3><div id="report-tipo-vinculo-summary"></div></article>
          <article class="card"><h3 data-i18n="report.employeeRecords">Fichas por colaborador</h3><div id="report-employee-fichas"></div></article>
          <article class="card">
            <h3 data-i18n="report.archivedRecords">Arquivo de fichas (histórico)</h3>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Gerada em</th><th>Colaborador</th><th>Empresa</th><th>Unidade</th><th>Status</th><th>Hash</th><th>Ações</th></tr></thead>
                <tbody id="report-archive-table"></tbody>
              </table>
            </div>
            <small id="report-archive-pagination" class="hint"></small>
          </article>
        </div>
      </section>
