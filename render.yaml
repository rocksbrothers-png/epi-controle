services:
  - type: web
    name: epi-controle
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      # Fronteira de confiança de proxy — MEDIDA (R0.5, 2026-09-22).
      # Ver docs/R05_CADEIA_DE_PROXY.md. Precisa existir também no painel do
      # Render: o blueprint não é provadamente a configuração efetiva.
      - key: RATE_LIMIT_TRUSTED_PROXY_HOPS
        value: "3"
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: OCR_REQUIRED
        value: "1"
      # Mercado Pago — defina os valores no painel do Render (sync:false).
      # O Access Token é SECRETO e fica somente no backend.
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_PUBLIC_KEY
        sync: false
      - key: MERCADO_PAGO_ENV
        value: sandbox
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
