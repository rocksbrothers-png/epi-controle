  <!-- Recovery token modal -->
  <div id="recovery-token-modal" class="modal-overlay" hidden>
    <div class="card form-stack modal-card" style="max-width:480px;width:90%;">
      <h3>Chave de recuperação gerada</h3>
      <p class="hint">Compartilhe esta chave com o usuário. Válida por <strong>24 horas</strong> e de uso único.</p>
      <div style="display:flex;align-items:center;gap:8px;background:#f5f0eb;border:1px solid #d4b896;border-radius:6px;padding:10px 14px;">
        <code id="recovery-token-value" style="flex:1;font-size:13px;word-break:break-all;font-family:monospace;"></code>
        <button id="recovery-token-copy" class="ghost" type="button" style="white-space:nowrap;">Copiar</button>
      </div>
      <p class="hint" style="margin-top:4px;">Após fechar, esta chave não poderá ser recuperada novamente.</p>
      <button id="recovery-token-close" class="primary" type="button">Fechar</button>
    </div>
  </div>

  <!-- Master admin profile modal -->
  <div id="master-profile-modal" class="modal-overlay" hidden>
    <div class="card form-stack modal-card" style="max-width:440px;width:90%;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <h3 style="margin:0;">Meu Perfil</h3>
        <button id="master-profile-close" class="ghost" type="button" style="padding:4px 10px;">✕</button>
      </div>

      <!-- Section 1: Email -->
      <div style="background:#f5f0eb;border-radius:8px;padding:14px 16px;">
        <strong style="font-size:13px;display:block;margin-bottom:8px;">E-mail de recuperação</strong>
        <input id="master-profile-email" type="email" autocomplete="email" placeholder="seu@email.com" style="width:100%;box-sizing:border-box;">
        <small class="hint" style="margin-top:4px;display:block;">Usado para receber chave de recuperação de senha por e-mail.</small>
        <button id="master-profile-save" class="primary" type="button" style="margin-top:10px;width:100%;">Salvar e-mail</button>
      </div>

      <!-- Section 2: Change password -->
      <div style="background:#f5f0eb;border-radius:8px;padding:14px 16px;">
        <strong style="font-size:13px;display:block;margin-bottom:8px;">Trocar senha</strong>
        <label style="display:block;margin-bottom:6px;">Senha atual<input id="master-current-password" type="password" autocomplete="current-password" style="width:100%;box-sizing:border-box;"></label>
        <label style="display:block;margin-bottom:6px;">Nova senha<input id="master-new-password" type="password" autocomplete="new-password" minlength="6" style="width:100%;box-sizing:border-box;"></label>
        <label style="display:block;margin-bottom:6px;">Confirmar nova senha<input id="master-confirm-password" type="password" autocomplete="new-password" minlength="6" style="width:100%;box-sizing:border-box;"></label>
        <button id="master-change-password" class="primary" type="button" style="margin-top:4px;width:100%;">Atualizar senha</button>
      </div>

      <div id="master-profile-feedback" class="form-feedback" aria-live="polite"></div>
    </div>
  </div>
